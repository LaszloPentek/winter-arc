name: Android kapcsolat APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-companion/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and lint
        working-directory: android-companion
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: winter-arc-android-preview
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
